<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick PayMoney | Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <link href="css/login.css" rel="stylesheet"/>
    <link href="css/style.css" rel="stylesheet"/>
</head>


<body>

<div class="main-wrapper">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="top-header">

        <div class="header-inner">

            <a href="index.html"
               class="text-decoration-none">

                <div class="logo">
                    Quick Pay<span class="logo-x">Money</span>
                </div>

            </a>


            <div class="header-actions">

                <a href="register.html"
                   class="header-btn text-decoration-none">

                    <i class="bi bi-person-fill"></i>

                    Register

                </a>


                <button type="button"
                        class="header-btn icon-only" onclick="window.location.href='contact.html'">

                    <i class="bi bi-headset"></i>

                </button>

            </div>

        </div>

    </header>



    <!-- =====================================
         LOGIN
    ====================================== -->

    <main class="login-area">

        <div class="login-card">


            <!-- HEADING -->

            <div class="login-heading">

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login with your Email and Password
                </p>

            </div>



            <!-- FORM -->

            <form action="login.html"
                  method="post"
                  autocomplete="off">


                <!-- EMAIL -->

                <div class="input-group-custom">

                    <input type="email"
                           name="email"
                           class="form-control-custom"
                           placeholder="Email Address"
                           required>

                </div>



                <!-- PASSWORD -->

                <div class="input-group-custom">

                    <input type="password"
                           name="password"
                           id="password"
                           class="form-control-custom password-input"
                           placeholder="Password"
                           required>

                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword()">

                        <i class="bi bi-eye-fill"
                           id="passwordIcon"></i>

                    </button>

                </div>



                <!-- FORGOT -->

                <div class="forgot-row">

                    <a href="forgot-password.html"
                       class="forgot-link">

                        Forgot Password?

                    </a>

                </div>



                <!-- LOGIN -->

                <button type="submit"
                        class="login-btn">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login Now

                </button>


            </form>



            <!-- REGISTER -->

            <div class="register-text">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </div>


        </div>

    </main>

      <a href="#"
            class="whatsapp">

            <i class="bi bi-whatsapp"></i>

        </a>

    <!-- =====================================
         BOTTOM NAV
    ====================================== -->

    <nav class="bottom-nav">

        <a href="index.html"
           class="nav-item">

            <div class="nav-icon">

                <i class="bi bi-house-fill"></i>

            </div>

            <span>
                Home
            </span>

        </a>


        <a href="exchange.html"
           class="nav-item">

            <div class="nav-icon">

                <i class="bi bi-arrow-left-right"></i>

            </div>

            <span>
                Exchange
            </span>

        </a>


        <a href="login.html"
           class="nav-item active">

            <div class="nav-icon">

                <i class="bi bi-person-fill"></i>

            </div>

            <span>
                Profile
            </span>

        </a>

    </nav>

</div>





</body>
</html>
