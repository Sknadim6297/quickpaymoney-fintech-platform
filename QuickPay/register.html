<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick Pay Money | Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/register.css"/>
    <link rel="stylesheet" href="css/style.css"/>
</head>


<body>

    <div class="main-wrapper">


        <!-- HEADER -->

        <header class="top-header">

            <div class="header-inner">

                <a href="index.html"
                    class="text-decoration-none">

                    <div class="logo">
                        Quick Pay<span class="logo-x">Money</span>
                    </div>

                </a>


                <div class="header-actions">

                    <a href="login.html"
                        class="header-btn">

                        <i class="bi bi-person-fill"></i>

                        Login

                    </a>


                    <button type="button"
                        class="header-btn icon-only" onclick="window.location.href='contact.html'">

                        <i class="bi bi-headset"></i>

                    </button>

                </div>

            </div>

        </header>



        <!-- REGISTER -->

        <main class="register-area">

        <div class="register-card">


            <!-- HEADING -->

            <div class="register-heading">

                <h1>
                    Let's Get Started
                </h1>

                <p>
                    Create your Quick  Pay account.
                </p>

            </div>



            <form action="register.html"
                  method="post"
                  autocomplete="off">


                <!-- NAME -->

                <div class="input-group-custom">

                    <input type="text"
                           name="name"
                           class="form-control-custom"
                           placeholder="Full Name"
                           required>

                </div>


                <!-- MOBILE -->

                <div class="input-group-custom">

                    <input type="tel"
                           name="mobile"
                           class="form-control-custom"
                           placeholder="Mobile Number"
                           maxlength="10"
                           inputmode="numeric"
                           pattern="[0-9]{10}"
                           required>

                </div>


                <!-- EMAIL -->

                <div class="input-group-custom">

                    <input type="email"
                           name="email"
                           class="form-control-custom"
                           placeholder="Email Address"
                           required>

                </div>


                <!-- PASSWORD -->

                <div class="input-group-custom password-wrapper">

                    <input type="password"
                           name="password"
                           id="password"
                           class="form-control-custom"
                           placeholder="Password"
                           required>

                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword('password','passwordIcon')">

                        <i class="bi bi-eye-fill"
                           id="passwordIcon"></i>

                    </button>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group-custom password-wrapper">

                    <input type="password"
                           name="confirm_password"
                           id="confirmPassword"
                           class="form-control-custom"
                           placeholder="Confirm Password"
                           required>

                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword('confirmPassword','confirmIcon')">

                        <i class="bi bi-eye-fill"
                           id="confirmIcon"></i>

                    </button>

                </div>



                <!-- GENDER -->

                <div class="gender-label">
                    Select Gender
                </div>


                <div class="gender-options">

                    <div class="gender-option">

                        <input type="radio"
                               name="gender"
                               id="male"
                               value="Male"
                               required>

                        <label for="male">
                            Male
                        </label>

                    </div>


                    <div class="gender-option">

                        <input type="radio"
                               name="gender"
                               id="female"
                               value="Female">

                        <label for="female">
                            Female
                        </label>

                    </div>


                    <div class="gender-option">

                        <input type="radio"
                               name="gender"
                               id="other"
                               value="Other">

                        <label for="other">
                            Other
                        </label>

                    </div>

                </div>



                <!-- TERMS -->

                <div class="terms-row">

                    <input type="checkbox"
                           id="terms"
                           name="terms"
                           required>

                    <label for="terms">

                        I agree to the

                        <a href="terms.html">
                            Terms &amp; Conditions
                        </a>

                    </label>

                </div>



                <!-- REGISTER -->

                <button type="submit"
                        class="register-btn">

                    <i class="bi bi-person-plus-fill"></i>

                    Register

                </button>


            </form>



            <!-- LOGIN -->

            <div class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>


        </div>

        </main>

          <a href="#"
            class="whatsapp">

            <i class="bi bi-whatsapp"></i>

        </a>

        <!-- BOTTOM NAV -->

        <nav class="bottom-nav">

            <a href="index.html"
                class="nav-item">

                <div class="nav-icon">
                    <i class="bi bi-house-fill"></i>
                </div>

                <span>Home</span>

            </a>


            <a href="exchange.html"
                class="nav-item">

                <div class="nav-icon">
                    <i class="bi bi-arrow-left-right"></i>
                </div>

                <span>Exchange</span>

            </a>


            <a href="login.html"
                class="nav-item active">

                <div class="nav-icon">
                    <i class="bi bi-person-fill"></i>
                </div>

                <span>Profile</span>

            </a>

        </nav>

    </div>

  





</body>
</html>
