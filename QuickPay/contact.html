<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick PayMoney | Premium Support</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link href="css/contact.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
</head>


<body>

    <div class="main-wrapper">


        <!-- HEADER -->

        <header class="top-header">

            <div class="header-inner">

                <a href="index.html"
                    class="text-decoration-none">

                    <div class="logo">
                        Quick Pay<span class="logo-x">Money</span>
                    </div>

                </a>


                <div class="header-actions">

                    <a href="login.html"
                        class="header-btn">

                        <i class="bi bi-person-fill"></i>
                        Login

                    </a>


                  <!--  <button class="header-btn icon-only" onclick="window.location.href='contact.html'">

                        <i class="bi bi-headset"></i>

                    </button>-->

                </div>

            </div>

        </header>



        <!-- SUPPORT -->

        <main class="support-area">


        <!-- PREMIUM SUPPORT -->

        <div class="support-banner">

            <div class="support-icon">

                <i class="bi bi-headset"></i>

            </div>

            <h1>
                24/7 Premium Support
            </h1>

            <p>
                We're here whenever you need us.
            </p>

        </div>



        <!-- FORM CARD -->

        <div class="support-card">


            <div class="support-heading">

                <h2>
                    Let's Solve Your Problem
                </h2>

                <p>
                    Tell us how we can help you.
                </p>

            </div>



            <form action="support.html"
                  method="post">


                <!-- NAME -->

                <div class="input-group-custom">

                    <input type="text"
                           name="name"
                           class="form-control-custom"
                           placeholder="Full Name"
                           required>

                </div>


                <!-- MOBILE -->

                <div class="input-group-custom">

                    <input type="tel"
                           name="mobile"
                           class="form-control-custom"
                           placeholder="Mobile Number"
                           maxlength="10"
                           inputmode="numeric"
                           pattern="[0-9]{10}"
                           required>

                </div>


                <!-- EMAIL -->

                <div class="input-group-custom">

                    <input type="email"
                           name="email"
                           class="form-control-custom"
                           placeholder="Email Address"
                           required>

                </div>


                <!-- SUBJECT -->

                <div class="input-group-custom">

                    <input type="text"
                           name="subject"
                           class="form-control-custom"
                           placeholder="Subject"
                           required>

                </div>


                <!-- GENDER -->

                <div class="gender-label">
                    Select Gender
                </div>


                <div class="gender-options">

                    <div class="gender-option">

                        <input type="radio"
                               name="gender"
                               id="male"
                               value="Male"
                               required>

                        <label for="male">
                            Male
                        </label>

                    </div>


                    <div class="gender-option">

                        <input type="radio"
                               name="gender"
                               id="female"
                               value="Female">

                        <label for="female">
                            Female
                        </label>

                    </div>


                    <div class="gender-option">

                        <input type="radio"
                               name="gender"
                               id="other"
                               value="Other">

                        <label for="other">
                            Other
                        </label>

                    </div>

                </div>


                <!-- MESSAGE -->

                <div class="input-group-custom">

                    <textarea name="message"
                              class="form-control-custom"
                              placeholder="Describe your problem..."
                              required></textarea>

                </div>


                <!-- SUBMIT -->

                <button type="submit"
                        class="submit-btn">

                    <i class="bi bi-send-fill"></i>

                    Submit Request

                </button>

            </form>


        </div> 

    </main>

        
        <!-- =====================================
         WHATSAPP
    ====================================== -->

        <a href="#"
            class="whatsapp">

            <i class="bi bi-whatsapp"></i>

        </a>


        <!-- BOTTOM NAV -->

        <nav class="bottom-nav">

            <a href="index.html"
                class="nav-item">

                <div class="nav-icon">
                    <i class="bi bi-house-fill"></i>
                </div>

                <span>Home</span>

            </a>


            <a href="exchange.html"
                class="nav-item">

                <div class="nav-icon">
                    <i class="bi bi-arrow-left-right"></i>
                </div>

                <span>Exchange</span>

            </a>

            <a href="login.html"
                class="nav-item active">

                <div class="nav-icon">
                    <i class="bi bi-person-fill"></i>
                </div>

                <span>Profile</span>

            </a>

        </nav>

    </div>

</body>
</html>
