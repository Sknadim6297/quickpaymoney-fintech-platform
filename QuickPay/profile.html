<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick PayMoney | Premium Support</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="css/contact.css" rel="stylesheet" />
    
    <link href="css/style.css" rel="stylesheet" />
    <style>
        /* =========================================
   PROFILE CONTAINER
========================================= */

.profile-container {
    width: 100%;
    max-width: 850px;
    margin: 30px auto 120px;
    padding: 0 20px;
}


/* =========================================
   PROFILE CARD
========================================= */

.profile-card {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid #252525;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 22px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
}


/* =========================================
   TITLE
========================================= */

.profile-title {
    display: flex;
    align-items: center;
    gap: 9px;

    color: #ffffff;
    font-size: 21px;
    font-weight: 700;

    padding-bottom: 16px;
    margin-bottom: 20px;

    border-bottom: 1px solid #292929;
}

.profile-title i {
    color: #ffc400;
    font-size: 22px;
}


/* =========================================
   PROFILE DETAILS
========================================= */

.profile-details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}


/* =========================================
   DETAIL ITEM
========================================= */

.detail-item {
    background: #151515;
    border: 1px solid #252525;
    border-radius: 12px;
    padding: 15px 17px;
}

.detail-label {
    display: block;

    color: #888;
    font-size: 13px;
    font-weight: 500;

    margin-bottom: 6px;
}

.detail-value {
    display: block;

    color: #ffffff;
    font-size: 16px;
    font-weight: 600;

    word-break: break-word;
}


/* =========================================
   FORM ROW
========================================= */

.form-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px 20px;
}


/* =========================================
   INPUT GROUP
========================================= */

.input-group-custom {
    width: 100%;
}

.input-group-custom label {
    display: block;

    color: #ffffff;
    font-size: 14px;
    font-weight: 600;

    margin-bottom: 8px;
}


/* =========================================
   INPUT / SELECT
========================================= */

.form-control-custom {
    width: 100%;
    height: 52px;

    background: #1b1e26;
    color: #ffffff;

    border: 1px solid #383d49;
    border-radius: 15px;

    padding: 0 17px;

    font-family: 'Poppins', Arial, sans-serif;
    font-size: 14px;

    outline: none;

    transition: all 0.25s ease;
}


/* Placeholder */

.form-control-custom::placeholder {
    color: #737b8e;
    opacity: 1;
}


/* Focus */

.form-control-custom:focus {
    border-color: #ffc400;
    background: #1d2029;

    box-shadow: 0 0 0 3px rgba(255, 196, 0, 0.10);
}


/* Select */

select.form-control-custom {
    cursor: pointer;
    appearance: auto;
}


/* =========================================
   USDT SECTION
========================================= */

.usdt-section {
    width: 100%;
    margin-top: 22px;
}

.usdt-label {
    display: block;

    color: #ffffff;
    font-size: 15px;
    font-weight: 600;

    margin-bottom: 8px;
}

.usdt-label i {
    color: #ffc400;
    margin-right: 7px;
}


/* =========================================
   BUTTON AREA
========================================= */

.button-area {
    width: 100%;
    margin-top: 25px;

    display: flex;
    justify-content: flex-end;
}


/* =========================================
   SAVE BUTTON
========================================= */

.save-profile-btn {
    min-width: 160px;
    height: 48px;

    border: none;
    border-radius: 12px;

    background: #ffc400;
    color: #000000;

    padding: 0 25px;

    font-family: 'Poppins', Arial, sans-serif;
    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    transition: all 0.25s ease;
}

.save-profile-btn i {
    margin-right: 7px;
}

.save-profile-btn:hover {
    background: #ffd633;
    transform: translateY(-1px);
    box-shadow: 0 7px 20px rgba(255, 196, 0, 0.20);
}

.save-profile-btn:active {
    transform: translateY(0);
}


/* =========================================
   MOBILE RESPONSIVE
========================================= */

@media (max-width: 767px) {

    .profile-container {
        margin: 20px auto 110px;
        padding: 0 14px;
    }

    .profile-card {
        padding: 18px;
        border-radius: 15px;
    }

    .profile-title {
        font-size: 19px;
        padding-bottom: 14px;
        margin-bottom: 17px;
    }

    .profile-title i {
        font-size: 20px;
    }

    .profile-details {
        grid-template-columns: 1fr;
        gap: 11px;
    }

    .detail-item {
        padding: 13px 14px;
    }

    .detail-value {
        font-size: 15px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .form-control-custom {
        height: 50px;
        border-radius: 13px;
    }

    .usdt-section {
        margin-top: 18px;
    }

    .button-area {
        justify-content: stretch;
    }

    .save-profile-btn {
        width: 100%;
        height: 50px;
    }
}


/* =========================================
   SMALL MOBILE
========================================= */

@media (max-width: 400px) {

    .profile-container {
        padding: 0 10px;
    }

    .profile-card {
        padding: 15px;
    }

    .profile-title {
        font-size: 18px;
    }

    .detail-label {
        font-size: 12px;
    }

    .detail-value {
        font-size: 14px;
    }

    .input-group-custom label,
    .usdt-label {
        font-size: 13px;
    }

    .form-control-custom {
        font-size: 13px;
    }

}
    </style>
</head>


<body>

    <div class="main-wrapper">


        <!-- HEADER -->

        <header class="top-header">

            <div class="header-inner">

                <a href="index.html"
                    class="text-decoration-none">

                    <div class="logo">
                        Quick Pay<span class="logo-x">Money</span>
                    </div>

                </a>


                <div class="header-actions">

                    <a href="login.html"
                        class="header-btn">

                        <i class="bi bi-person-fill"></i>
                        Login

                    </a>


                    <!--  <button class="header-btn icon-only" onclick="window.location.href='contact.html'">

                        <i class="bi bi-headset"></i>

                    </button>-->

                </div>

            </div>

        </header>



        <!-- SUPPORT -->

        <main class="support-area">


        <div class="profile-container">

    <!-- ================= PROFILE DETAILS ================= -->

    <div class="profile-card">

        <div class="profile-title">
            <i class="bi bi-person-circle"></i>
            Profile Details
        </div>

        <div class="profile-details">

            <div class="detail-item">
                <span class="detail-label">Full Name</span>
                <span class="detail-value">John Doe</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Mobile Number</span>
                <span class="detail-value">9876543210</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Email Address</span>
                <span class="detail-value">john@example.com</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Gender</span>
                <span class="detail-value">Male</span>
            </div>

        </div>

    </div>


    <!-- ================= BANK DETAILS ================= -->

    <div class="profile-card">

        <div class="profile-title">
            <i class="bi bi-bank"></i>
            Bank Details
        </div>


        <form action="#" method="post" autocomplete="off">

            <div class="form-row">

                <!-- ACCOUNT HOLDER -->

                <div class="input-group-custom">

                    <label>Account Holder Name</label>

                    <input type="text"
                           name="account_holder"
                           class="form-control-custom"
                           placeholder="Account Holder Name"
                           required>

                </div>


                <!-- BANK NAME -->

                <div class="input-group-custom">

                    <label>Bank Name</label>

                    <input type="text"
                           name="bank_name"
                           class="form-control-custom"
                           placeholder="Bank Name"
                           required>

                </div>


                <!-- ACCOUNT NUMBER -->

                <div class="input-group-custom">

                    <label>Account Number</label>

                    <input type="text"
                           name="account_number"
                           class="form-control-custom"
                           placeholder="Account Number"
                           inputmode="numeric"
                           required>

                </div>


                <!-- IFSC -->

                <div class="input-group-custom">

                    <label>IFSC Code</label>

                    <input type="text"
                           name="ifsc"
                           class="form-control-custom"
                           placeholder="IFSC Code"
                           maxlength="11"
                           style="text-transform:uppercase;"
                           required>

                </div>


                <!-- BRANCH -->

                <div class="input-group-custom">

                    <label>Branch Name</label>

                    <input type="text"
                           name="branch"
                           class="form-control-custom"
                           placeholder="Branch Name"
                           required>

                </div>


                <!-- ACCOUNT TYPE -->

                <div class="input-group-custom">

                    <label>Account Type</label>

                    <select name="account_type"
                            class="form-control-custom"
                            required>

                        <option value="">Select Account Type</option>
                        <option value="Savings">Savings Account</option>
                        <option value="Current">Current Account</option>

                    </select>

                </div>

            </div>


            <!-- ================= USDT ADDRESS ================= -->

            <div class="usdt-section">

                <label class="usdt-label">
                    <i class="bi bi-wallet2"></i>
                    USDT Address
                </label>

                <input type="text"
                       name="usdt_address"
                       class="form-control-custom"
                       placeholder="Enter your USDT wallet address"
                       required>

            </div>


            <!-- ================= SAVE BUTTON ================= -->

            <div class="button-area">

                <button type="submit"
                        class="save-profile-btn">

                    <i class="bi bi-check-circle-fill"></i>

                    Save Details

                </button>

            </div>

        </form>

    </div>

</div>

    </main>


        <!-- =====================================
         WHATSAPP
    ====================================== -->

        <a href="#"
            class="whatsapp">

            <i class="bi bi-whatsapp"></i>

        </a>


        <!-- BOTTOM NAV -->

        <nav class="bottom-nav">

            <a href="index.html"
                class="nav-item">

                <div class="nav-icon">
                    <i class="bi bi-house-fill"></i>
                </div>

                <span>Home</span>

            </a>


            <a href="exchange.html"
                class="nav-item">

                <div class="nav-icon">
                    <i class="bi bi-arrow-left-right"></i>
                </div>

                <span>Exchange</span>

            </a>

            <a href="login.html"
                class="nav-item active">

                <div class="nav-icon">
                    <i class="bi bi-person-fill"></i>
                </div>

                <span>Profile</span>

            </a>

        </nav>

    </div>

</body>
</html>
